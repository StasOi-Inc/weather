name: android-ci

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: macbuild
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK components
        run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          ./gradlew :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/

  assemble-debug:
    runs-on: macbuild
    needs: unit-tests
    timeout-minutes: 60
    env:
      OWM_KEY: ${{ secrets.OWM_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK components
        run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  assemble-release:
    runs-on: macbuild
    needs: unit-tests
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 60
    env:
      OWM_KEY: ${{ secrets.OWM_KEY }}
      WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
      RELEASE_STORE_FILE: release-keystore.jks
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Decode signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
      - name: Install SDK components
        run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          if [ -f ~/.macbuild/env.sh ]; then . ~/.macbuild/env.sh; fi
          ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/
